<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字数统计工具</title>
<script>
    /* 在样式生效前确定主题，避免深色模式下的白屏闪烁；存储键与站内其他页面保持一致。 */
    (function () {
        try {
            var t = localStorage.getItem('cipher_theme_v2');
            if (t === 'dark' || t === 'light') { document.documentElement.setAttribute('data-theme', t); return; }
        } catch (e) { /* localStorage 不可用时忽略 */ }
        try {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        } catch (e) { /* 忽略 */ }
    })();
</script>
<style>
    :root {
        --bg: #fafafa;
        --surface: #fff;
        --text: #1a1a1a;
        --text-secondary: #6e6e6e;
        --text-tertiary: #999;
        --border: #e0e0e0;
        --border-light: #eee;
        --accent: #1a1a1a;
        --accent-hover: #3a3a3a;
        --danger: #c0392b;
        --ok: #237a38;
        --radius: 4px;
        --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', 'Menlo', monospace;
        --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        --transition: 120ms ease;
        color-scheme: light;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: var(--font-sans);
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 16px 60px;
    }

    .container { width: 100%; max-width: 820px; min-width: 0; }

    /* ---------- 顶部标题 ---------- */
    .header { margin-bottom: 36px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .header-title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
    .header-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text); flex-shrink: 0; }
    .header-subtitle { font-size: 12px; color: var(--text-tertiary); }

    /* ---------- 主题切换按钮 ---------- */
    .dtp-theme-toggle { align-self: center; margin-left: auto; padding: 6px 12px; font-size: 11px; }

    /* ---------- 分区标签 ---------- */
    .section-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-tertiary);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border-light); }

    /* ---------- 输入区 ---------- */
    textarea {
        width: 100%;
        font-family: var(--font-mono);
        font-size: 13px;
        line-height: 1.55;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--text);
        resize: vertical;
        transition: border-color var(--transition);
        outline: none;
        -webkit-appearance: none;
    }
    textarea:focus, input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(26,26,26,0.08); }
    textarea::placeholder { color: var(--text-tertiary); }
    #text-input { min-height: 260px; max-height: 560px; }
    textarea::-webkit-scrollbar { width: 8px; }
    textarea::-webkit-scrollbar-thumb { background: #d8d8de; border-radius: 4px; }
    textarea::-webkit-scrollbar-track { background: transparent; }
    [data-theme="dark"] textarea::-webkit-scrollbar-thumb { background: #33333a; }

    /* ---------- 按钮 ---------- */
    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 8px 16px;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.02em;
        cursor: pointer;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--text);
        transition: all var(--transition);
        font-family: var(--font-sans);
        white-space: nowrap;
        outline: none;
        user-select: none;
    }
    .btn:hover { background: #f4f4f4; border-color: #c0c0c0; }
    .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn.danger { border-color: var(--danger); color: var(--danger); }
    .btn.danger:hover { background: #fdf2f2; border-color: var(--danger); }

    /* ---------- 布局工具类 ---------- */
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .gap-sm { gap: 8px; }
    .mt-sm { margin-top: 10px; }
    .mt-md { margin-top: 18px; }
    .mb-sm { margin-bottom: 8px; }
    .note { font-size: 11px; color: var(--text-tertiary); letter-spacing: 0.02em; }

    /* ---------- 统计网格 ---------- */
    .stats { margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 10px; }
    .stat {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
    }
    .stat .label {
        font-size: 12px;
        color: var(--text-secondary);
        letter-spacing: .04em;
        white-space: nowrap;
    }
    .stat .value {
        font-size: 24px;
        font-weight: 600;
        line-height: 1.1;
        color: var(--danger);
        font-variant-numeric: tabular-nums;
        letter-spacing: -.01em;
        word-break: break-all;
    }
    /* 阅读时长这类文本值小一点 */
    .stat .value.text-value { font-size: 18px; }

    ::selection { background: var(--text); color: var(--bg); }

    /* ---------- 深色模式（与站内其他页面共用 cipher_theme_v2 存储键） ---------- */
    [data-theme="dark"] {
        color-scheme: dark;
        --bg: #0d0d0f;
        --surface: #17171a;
        --text: #e9e9ec;
        --text-secondary: #a1a1a8;
        --text-tertiary: #71717a;
        --border: #2c2c31;
        --border-light: #222227;
        --accent: #e9e9ec;
        --accent-hover: #ffffff;
        --danger: #e5484d;
        --ok: #7bd88f;
    }
    [data-theme="dark"] .btn:hover { background: #232328; border-color: #45454d; }
    [data-theme="dark"] .btn.primary { color: #101013; }
    [data-theme="dark"] .btn.primary:hover { background: #ffffff; border-color: #ffffff; }
    [data-theme="dark"] .btn.danger:hover { background: #2a1618; border-color: #7a2b2f; }
    [data-theme="dark"] textarea:focus,
    [data-theme="dark"] input:focus,
    [data-theme="dark"] select:focus { box-shadow: 0 0 0 1px rgba(255,255,255,0.14); }

    @media (max-width: 600px) {
        body { padding: 20px 10px 40px; }
        .header { margin-bottom: 24px; }
        #text-input { min-height: 200px; }
        .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .stat .value { font-size: 20px; }
        .stat .value.text-value { font-size: 15px; }
    }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <span class="header-title">字数统计工具</span>
        <span class="header-dot"></span>
        <span class="header-subtitle">实时统计</span>
        <button class="btn dtp-theme-toggle" id="themeToggle" type="button" title="切换深色 / 浅色模式" aria-label="切换深色或浅色模式" aria-pressed="false">深色模式</button>
    </div>

    <div class="section-label">输入</div>
    <textarea id="text-input" placeholder="在此输入或粘贴文本，下方各项统计会实时更新…"></textarea>

    <div class="row mt-sm gap-sm">
        <button class="btn primary" id="copy-button" type="button">复制全文</button>
        <button class="btn danger" id="clear-button" type="button">清空</button>
    </div>

    <div class="section-label mt-md">统计</div>
    <section class="stats">
        <div class="stat"><span class="label">总字符数</span><span class="value" data-stat="chars">0</span></div>
        <div class="stat"><span class="label">不含空格</span><span class="value" data-stat="noSpace">0</span></div>
        <div class="stat"><span class="label">汉字</span><span class="value" data-stat="chinese">0</span></div>
        <div class="stat"><span class="label">字母</span><span class="value" data-stat="letters">0</span></div>
        <div class="stat"><span class="label">数字</span><span class="value" data-stat="digits">0</span></div>
        <div class="stat"><span class="label">标点符号</span><span class="value" data-stat="punct">0</span></div>
        <div class="stat"><span class="label">空白字符</span><span class="value" data-stat="spaces">0</span></div>
        <div class="stat"><span class="label">英文单词</span><span class="value" data-stat="words">0</span></div>
        <div class="stat"><span class="label">行数</span><span class="value" data-stat="lines">0</span></div>
        <div class="stat"><span class="label">段落数</span><span class="value" data-stat="paragraphs">0</span></div>
        <div class="stat"><span class="label">阅读时长</span><span class="value text-value" data-stat="reading">0 秒</span></div>
    </section>

    <p class="note mt-sm">按内容构成统计：总字符数按码点计（emoji 等代理对算 1 个），阅读时长按汉字 300 字/分钟、英文 200 词/分钟估算。</p>
</div>

<script>
(function () {
    "use strict";

    var input   = document.getElementById('text-input');
    var copyBtn = document.getElementById('copy-button');
    var clearBtn = document.getElementById('clear-button');

    /* 统计项对应的 DOM 节点 */
    var statEls = {};
    document.querySelectorAll('[data-stat]').forEach(function (el) {
        statEls[el.dataset.stat] = el;
    });

    /* 中文标点 + 英文标点 */
    var PUNCT_RE = /[\u3001-\u303F\uFF01-\uFF0F\uFF1A-\uFF20\uFF3B-\uFF40\uFF5B-\uFF65!-\/:-@\[-`{-~]/g;
    var CHINESE_RE = /[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]/g;
    var LETTER_RE = /[A-Za-z]/g;
    var DIGIT_RE = /[0-9]/g;
    var SPACE_RE = /\s/g;
    var WORD_RE = /[A-Za-z]+(?:['’-][A-Za-z]+)*/g;

    /* 千分位 */
    function formatNumber(num) {
        return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }

    /* 阅读时长估算：汉字 300 字/分钟，英文 200 词/分钟 */
    function readingTime(chinese, words, hasText) {
        if (!hasText) return '0 秒';
        var seconds = (chinese / 300 + words / 200) * 60;
        var sec = Math.max(1, Math.round(seconds));
        if (sec < 60) return sec + ' 秒';
        return (sec / 60).toFixed(1) + ' 分钟';
    }

    /* 核心统计 */
    function analyze(text) {
        var chinese = (text.match(CHINESE_RE) || []).length;
        var words   = (text.match(WORD_RE) || []).length;
        var hasText = text.trim().length > 0;

        return {
            chars:      Array.from(text).length,
            noSpace:    Array.from(text.replace(SPACE_RE, '')).length,
            chinese:    chinese,
            letters:    (text.match(LETTER_RE) || []).length,
            digits:     (text.match(DIGIT_RE) || []).length,
            punct:      (text.match(PUNCT_RE) || []).length,
            spaces:     (text.match(SPACE_RE) || []).length,
            words:      words,
            lines:      text.length ? text.split(/\r\n|\r|\n/).length : 0,
            paragraphs: text.split(/\n+/).filter(function (p) {
                            return p.trim().length > 0;
                        }).length,
            reading:    readingTime(chinese, words, hasText)
        };
    }

    /* 渲染 */
    function update() {
        var data = analyze(input.value);

        Object.keys(data).forEach(function (key) {
            var el = statEls[key];
            if (!el) return;
            var val = data[key];
            el.textContent = (typeof val === 'number') ? formatNumber(val) : val;
        });
    }

    /* 事件绑定 */
    input.addEventListener('input', update);

    clearBtn.addEventListener('click', function () {
        input.value = '';
        update();
        input.focus();
    });

    copyBtn.addEventListener('click', function () {
        var text = input.value;
        if (!text) {
            copyBtn.textContent = '内容为空';
            setTimeout(function () { copyBtn.textContent = '复制全文'; }, 1200);
            return;
        }

        function done() {
            copyBtn.textContent = '已复制 ✓';
            setTimeout(function () { copyBtn.textContent = '复制全文'; }, 1400);
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, function () {
                input.select();
                document.execCommand('copy');
                done();
            });
        } else {
            input.select();
            document.execCommand('copy');
            done();
        }
    });

    /* 初始化 */
    update();
})();

/* ============ 主题切换：与站内其他页面共用 cipher_theme_v2 ============ */
var THEME_KEY = 'cipher_theme_v2';
function applyTheme(theme, persist) {
    var normalized = theme === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', normalized);
    var isDark = normalized === 'dark';
    var btn = document.getElementById('themeToggle');
    if (btn) {
        btn.textContent = isDark ? '☀ 浅色模式' : '🌙 深色模式';
        btn.setAttribute('aria-pressed', String(isDark));
        btn.setAttribute('aria-label', isDark ? '切换到浅色模式' : '切换到深色模式');
    }
    /* 用户未显式选择过时，只跟随系统的深浅偏好显示，不写入存储，避免影响站内其他页面。 */
    if (persist !== false) {
        try { localStorage.setItem(THEME_KEY, normalized); } catch (e) { /* 存储不可用时仅本次生效 */ }
    }
}
applyTheme(document.documentElement.getAttribute('data-theme') || 'light', false);
document.getElementById('themeToggle').addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme') || 'light';
    applyTheme(cur === 'dark' ? 'light' : 'dark');
});
</script>

</body>
</html>
