<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密码生成器</title>
<script>
    /* 在样式生效前确定主题，避免深色模式下的白屏闪烁；存储键与站内其他页面保持一致。 */
    (function () {
        try {
            var t = localStorage.getItem('cipher_theme_v2');
            if (t === 'dark' || t === 'light') { document.documentElement.setAttribute('data-theme', t); return; }
        } catch (e) { /* localStorage 不可用时忽略 */ }
        try {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        } catch (e) { /* 忽略 */ }
    })();
</script>
<style>
    :root {
        --bg: #fafafa;
        --surface: #fff;
        --text: #1a1a1a;
        --text-secondary: #6e6e6e;
        --text-tertiary: #999;
        --border: #e0e0e0;
        --border-light: #eee;
        --accent: #1a1a1a;
        --accent-hover: #3a3a3a;
        --danger: #c0392b;
        --ok: #237a38;
        --radius: 4px;
        --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', 'Menlo', monospace;
        --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        --transition: 120ms ease;
        color-scheme: light;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: var(--font-sans);
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 16px 60px;
    }

    .container { width: 100%; max-width: 820px; min-width: 0; }

    /* ---------- 顶部标题 ---------- */
    .header { margin-bottom: 36px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .header-title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
    .header-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text); flex-shrink: 0; }
    .header-subtitle { font-size: 12px; color: var(--text-tertiary); }

    /* ---------- 主题切换按钮 ---------- */
    .dtp-theme-toggle { align-self: center; margin-left: auto; padding: 6px 12px; font-size: 11px; }

    /* ---------- 分区标签 ---------- */
    .section-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-tertiary);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border-light); }

    /* ---------- 按钮 ---------- */
    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 8px 16px;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.02em;
        cursor: pointer;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--text);
        transition: all var(--transition);
        font-family: var(--font-sans);
        white-space: nowrap;
        outline: none;
        user-select: none;
    }
    .btn:hover { background: #f4f4f4; border-color: #c0c0c0; }
    .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn.small { padding: 5px 10px; font-size: 11px; }
    .btn.copy-btn.copied { background: #f0faf0; border-color: #b7d9b7; color: #2d6a2d; pointer-events: none; }

    /* ---------- 布局工具类 ---------- */
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .gap-sm { gap: 8px; }
    .mt-sm { margin-top: 10px; }
    .mt-md { margin-top: 18px; }
    .mb-sm { margin-bottom: 8px; }
    .note { font-size: 11px; color: var(--text-tertiary); letter-spacing: 0.02em; }
    .note b { font-family: var(--font-mono); font-weight: 700; color: var(--text); }

    /* ---------- 密码输出区 ---------- */
    .output {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 96px;
        padding: 16px 14px 16px 18px;
        background: #f9f9f9;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        cursor: pointer;
        transition: border-color var(--transition);
    }
    .output:hover { border-color: #c0c0c0; }
    .output:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(26,26,26,0.08); outline: none; }

    .password {
        flex: 1;
        min-width: 0;
        max-height: 128px;
        overflow-y: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
        font-family: var(--font-mono);
        font-size: 20px;
        line-height: 1.5;
        letter-spacing: .02em;
        word-break: break-all;
        overflow-wrap: anywhere;
    }
    .password::-webkit-scrollbar { display: none; }

    .password.error {
        font-family: var(--font-sans);
        font-size: 13px;
        line-height: 1.6;
        letter-spacing: 0;
        color: var(--danger);
    }

    /* 字符着色：沿用站内语法高亮配色 */
    .ch-upper  { color: #7a3e9d; }
    .ch-lower  { color: var(--text); }
    .ch-digit  { color: #175ca8; }
    .ch-symbol { color: #b35b00; }

    /* ---------- 熵值 ---------- */
    .strength-bar-wrap { height: 3px; background: var(--border-light); border-radius: 2px; margin-top: 10px; overflow: hidden; }
    .strength-bar-fill { height: 100%; width: 0%; border-radius: 2px; background: var(--border); transition: width 200ms ease, background 200ms ease; }
    #entropyValue { font-family: var(--font-mono); transition: color .25s ease; }
    #entropyValue.weak   { color: #c0392b; }
    #entropyValue.fair   { color: #b35b00; }
    #entropyValue.good   { color: #856404; }
    #entropyValue.strong { color: #237a38; }
    #entropyValue.ultra  { color: #175ca8; }
    .strength-bar-fill.weak   { background: #c0392b; }
    .strength-bar-fill.fair   { background: #b35b00; }
    .strength-bar-fill.good   { background: #856404; }
    .strength-bar-fill.strong { background: #237a38; }
    .strength-bar-fill.ultra  { background: #175ca8; }

    /* ---------- 长度滑块 ---------- */
    input[type="range"] {
        flex: 1;
        min-width: 0;
        accent-color: var(--accent);
        cursor: pointer;
    }
    .length-value {
        font-family: var(--font-mono);
        font-size: 13px;
        font-weight: 600;
        min-width: 3ch;
        text-align: right;
    }

    /* ---------- 复选框 ---------- */
    .checkbox-label {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        color: var(--text-secondary);
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
    }
    .checkbox-label input { accent-color: var(--accent); }
    .checkbox-label input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---------- 主按钮 ---------- */
    .btn-generate {
        width: 100%;
        margin-top: 24px;
        padding: 12px 20px;
        font-size: 13px;
    }

    ::selection { background: var(--text); color: var(--bg); }

    /* ---------- 深色模式（与站内其他页面共用 cipher_theme_v2 存储键） ---------- */
    [data-theme="dark"] {
        color-scheme: dark;
        --bg: #0d0d0f;
        --surface: #17171a;
        --text: #e9e9ec;
        --text-secondary: #a1a1a8;
        --text-tertiary: #71717a;
        --border: #2c2c31;
        --border-light: #222227;
        --accent: #e9e9ec;
        --accent-hover: #ffffff;
        --danger: #e5484d;
        --ok: #7bd88f;
    }
    [data-theme="dark"] .btn:hover { background: #232328; border-color: #45454d; }
    [data-theme="dark"] .btn.primary { color: #101013; }
    [data-theme="dark"] .btn.primary:hover { background: #ffffff; border-color: #ffffff; }
    [data-theme="dark"] .btn.copy-btn.copied { background: #16261a; border-color: #2f5c39; color: #7bd88f; }
    [data-theme="dark"] .output { background: #1d1d21; }
    [data-theme="dark"] .output:hover { border-color: #45454d; }
    [data-theme="dark"] .output:focus-visible { box-shadow: 0 0 0 1px rgba(255,255,255,0.14); }
    [data-theme="dark"] .ch-upper  { color: #c792ea; }
    [data-theme="dark"] .ch-digit  { color: #79b8ff; }
    [data-theme="dark"] .ch-symbol { color: #ffab70; }
    [data-theme="dark"] #entropyValue.weak   { color: #e5484d; }
    [data-theme="dark"] #entropyValue.fair   { color: #ffab70; }
    [data-theme="dark"] #entropyValue.good   { color: #f5c877; }
    [data-theme="dark"] #entropyValue.strong { color: #7bd88f; }
    [data-theme="dark"] #entropyValue.ultra  { color: #79b8ff; }
    [data-theme="dark"] .strength-bar-fill.weak   { background: #e5484d; }
    [data-theme="dark"] .strength-bar-fill.fair   { background: #ffab70; }
    [data-theme="dark"] .strength-bar-fill.good   { background: #f5c877; }
    [data-theme="dark"] .strength-bar-fill.strong { background: #7bd88f; }
    [data-theme="dark"] .strength-bar-fill.ultra  { background: #79b8ff; }

    @media (max-width: 600px) {
        body { padding: 20px 10px 40px; }
        .header { margin-bottom: 24px; }
        .output { min-height: 84px; padding: 14px 10px 14px 14px; gap: 10px; }
        .password { font-size: 16px; }
        .btn-generate { margin-top: 18px; }
    }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <span class="header-title">密码生成器</span>
        <span class="header-dot"></span>
        <span class="header-subtitle">安全随机 · 本地生成</span>
        <button class="btn dtp-theme-toggle" id="themeToggle" type="button" title="切换深色 / 浅色模式" aria-label="切换深色或浅色模式" aria-pressed="false">深色模式</button>
    </div>

    <!-- 密码显示 -->
    <div class="section-label">密码</div>
    <div class="output" id="outputBox" tabindex="0" role="button" aria-label="点击复制密码">
        <div class="password" id="coloredPassword"></div>
        <button class="btn small copy-btn" id="copyBtn" type="button">复制</button>
    </div>
    <div class="strength-bar-wrap"><div class="strength-bar-fill" id="entropyBar"></div></div>
    <p class="note mt-sm">熵值 <b id="entropyValue">0</b> bits · 组合总数 <b id="totalCombinations">0</b> · 点击密码也可复制</p>

    <!-- 长度 -->
    <div class="section-label mt-md">密码长度</div>
    <div class="row gap-sm">
        <input type="range" id="lengthSlider" min="6" max="60" value="20" aria-label="密码长度">
        <span class="length-value" id="passwordLength">20</span>
    </div>

    <!-- 字符类型 -->
    <div class="section-label mt-md">字符类型</div>
    <div class="row gap-sm">
        <label class="checkbox-label"><input type="checkbox" id="includeUppercase" checked> 大写字母</label>
        <label class="checkbox-label"><input type="checkbox" id="includeLowercase" checked> 小写字母</label>
        <label class="checkbox-label"><input type="checkbox" id="includeNumbers" checked> 数字</label>
        <label class="checkbox-label"><input type="checkbox" id="includeSymbols" checked> 常用符号</label>
        <label class="checkbox-label"><input type="checkbox" id="includeLatin1" checked> Latin-1 补充</label>
    </div>

    <!-- 高级设置 -->
    <div class="section-label mt-md">高级设置</div>
    <div class="row gap-sm">
        <label class="checkbox-label"><input type="checkbox" id="noRepeat" checked> 字符不重复</label>
        <label class="checkbox-label"><input type="checkbox" id="excludeSimilar" checked> 排除相似字符</label>
        <label class="checkbox-label"><input type="checkbox" id="noConsecutive" checked> 避免连续字符</label>
    </div>

    <button class="btn primary btn-generate" id="generateBtn" type="button">重新生成密码</button>

    <p class="note mt-sm">密码由 crypto.getRandomValues 在本地生成，不会上传；设置项记忆在当前浏览器。熵值按「长度 × log₂(字符池大小)」估算，仅供参考。</p>
</div>

<script>
(function () {
  'use strict';

  const $ = (id) => document.getElementById(id);

  /* ---------------- 字符集 ---------------- */
  const CHARSETS = {
    upper:   'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    lower:   'abcdefghijklmnopqrstuvwxyz',
    digits:  '0123456789',
    symbols: '!@#$%^&*()_+[]{}|;:,.<>?',
    latin1:  '¡¢£¤¥¦§¨©ª«¬®¯°±²³´µ¶·¸¹º»¼½¾¿ÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏÐÑÒÓÔÕÖ×ØÙÚÛÜÝÞßàáâãäåæçèéêëìíîïðñòóôõö÷øùúûüýþÿ'
  };

  const SIMILAR = '1iIlL0Oo';

  const TYPE_OPTIONS = [
    { id: 'includeUppercase', key: 'upper'   },
    { id: 'includeLowercase', key: 'lower'   },
    { id: 'includeNumbers',   key: 'digits'  },
    { id: 'includeSymbols',   key: 'symbols' },
    { id: 'includeLatin1',    key: 'latin1'  }
  ];

  const BOOL_IDS = ['noRepeat', 'excludeSimilar', 'noConsecutive'];

  /* 熵值颜色分级 */
  const LEVELS = [
    { max: 50,       key: 'weak'   },
    { max: 80,       key: 'fair'   },
    { max: 120,      key: 'good'   },
    { max: 160,      key: 'strong' },
    { max: Infinity, key: 'ultra'  }
  ];

  /* ---------------- DOM ---------------- */
  const lengthSlider        = $('lengthSlider');
  const lengthValue         = $('passwordLength');
  const passwordEl          = $('coloredPassword');
  const outputBox           = $('outputBox');
  const entropyValue        = $('entropyValue');
  const entropyBar          = $('entropyBar');
  const totalCombinationsEl = $('totalCombinations');
  const copyBtn             = $('copyBtn');
  const generateBtn         = $('generateBtn');

  let currentPassword = '';
  let copyTimer = null;

  /* ============================================================
     浏览器记忆（localStorage）
     ============================================================ */
  const STORAGE_KEY = 'password-generator-settings-v1';

  function isStorageAvailable() {
    try {
      const k = '__pwd_gen_test__';
      localStorage.setItem(k, '1');
      localStorage.removeItem(k);
      return true;
    } catch (e) {
      return false;
    }
  }
  const storageOK = isStorageAvailable();

  function saveSettings() {
    if (!storageOK) return;
    try {
      const data = { length: Number(lengthSlider.value) };
      TYPE_OPTIONS.forEach(({ id }) => { data[id] = $(id).checked; });
      BOOL_IDS.forEach((id) => { data[id] = $(id).checked; });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) { /* 忽略写入异常 */ }
  }

  function loadSettings() {
    if (!storageOK) return;
    let data;
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      data = JSON.parse(raw);
      if (!data || typeof data !== 'object') return;
    } catch (e) { return; }

    // 长度
    if (typeof data.length === 'number' && isFinite(data.length)) {
      const min = Number(lengthSlider.min);
      const max = Number(lengthSlider.max);
      lengthSlider.value = String(Math.min(max, Math.max(min, Math.round(data.length))));
    }

    // 所有复选框（只接受布尔值）
    [...TYPE_OPTIONS.map((o) => o.id), ...BOOL_IDS].forEach((id) => {
      if (typeof data[id] === 'boolean') {
        $(id).checked = data[id];
      }
    });
  }

  /* ---------------- 无模偏差随机数 ---------------- */
  function randomInt(max) {
    if (max <= 1) return 0;
    const RANGE = 4294967296;                       // 2^32
    const limit = Math.floor(RANGE / max) * max;
    const buf = new Uint32Array(1);
    let value;
    do {
      crypto.getRandomValues(buf);
      value = buf[0];
    } while (value >= limit);
    return value % max;
  }

  /* ---------------- 构建字符池 ---------------- */
  function buildPool() {
    let pool = '';
    TYPE_OPTIONS.forEach(({ id, key }) => {
      if ($(id).checked) pool += CHARSETS[key];
    });

    if ($('excludeSimilar').checked) {
      pool = Array.from(pool).filter((c) => !SIMILAR.includes(c)).join('');
    }
    return Array.from(new Set(pool)).join('');
  }

  /* ---------------- 字符着色 ---------------- */
  function charClass(ch) {
    if (CHARSETS.upper.includes(ch))  return 'ch-upper';
    if (CHARSETS.digits.includes(ch)) return 'ch-digit';
    if (CHARSETS.lower.includes(ch))  return 'ch-lower';
    return 'ch-symbol';
  }

  function renderPassword(chars) {
    passwordEl.classList.remove('error');
    passwordEl.textContent = '';
    const frag = document.createDocumentFragment();
    chars.forEach((ch) => {
      const span = document.createElement('span');
      span.className = charClass(ch);
      span.textContent = ch;
      frag.appendChild(span);
    });
    passwordEl.appendChild(frag);
  }

  /* ---------------- 错误提示 ---------------- */
  function showError(message) {
    currentPassword = '';
    passwordEl.textContent = message;
    passwordEl.classList.add('error');

    entropyValue.textContent = '0';
    entropyValue.className = '';
    entropyBar.className = 'strength-bar-fill';
    entropyBar.style.width = '0%';
    totalCombinationsEl.textContent = '—';
  }

  /* ---------------- 统计与颜色分级 ---------------- */
  function updateStats(poolSize, length) {
    const entropy = length * Math.log2(poolSize);

    entropyValue.textContent = entropy.toFixed(1);

    const level = LEVELS.find((l) => entropy < l.max) || LEVELS[LEVELS.length - 1];
    entropyValue.className = level.key;
    entropyBar.className = 'strength-bar-fill ' + level.key;
    entropyBar.style.width = Math.min(100, (entropy / 160) * 100) + '%';

    const total = Math.pow(poolSize, length);
    totalCombinationsEl.textContent =
      Number.isFinite(total) ? total.toExponential(2) : '∞';
  }

  /* ---------------- 生成密码 ---------------- */
  function generatePassword() {
    const length           = Number(lengthSlider.value);
    const pool             = buildPool();
    const useNoRepeat      = $('noRepeat').checked;
    const useNoConsecutive = $('noConsecutive').checked;

    if (pool.length === 0) {
      showError('请至少选择一种字符类型');
      return;
    }
    if (useNoRepeat && pool.length < length) {
      showError(`可用字符不足：当前字符池仅 ${pool.length} 个字符，无法生成 ${length} 位不重复密码`);
      return;
    }
    if (useNoConsecutive && pool.length < 2) {
      showError('可用字符过少，无法避免连续重复字符');
      return;
    }

    const chars = [];
    const used = new Set();
    let last = null;
    let guard = 0;
    const guardLimit = length * 500 + 5000;

    while (chars.length < length && guard++ < guardLimit) {
      const ch = pool[randomInt(pool.length)];
      if (useNoRepeat && used.has(ch)) continue;
      if (useNoConsecutive && ch === last) continue;

      chars.push(ch);
      used.add(ch);
      last = ch;
    }

    while (chars.length < length) {          // 兜底（理论上不会触发）
      chars.push(pool[randomInt(pool.length)]);
    }

    currentPassword = chars.join('');
    renderPassword(chars);
    updateStats(pool.length, length);
  }

  /* ---------------- 复制 ---------------- */
  function legacyCopy() {
    const ta = document.createElement('textarea');
    ta.value = currentPassword;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) { /* 忽略 */ }
    document.body.removeChild(ta);
  }

  function flashCopied() {
    copyBtn.textContent = '已复制';
    copyBtn.classList.add('copied');
    clearTimeout(copyTimer);
    copyTimer = setTimeout(() => {
      copyBtn.textContent = '复制';
      copyBtn.classList.remove('copied');
    }, 1600);
  }

  function copyPassword() {
    if (!currentPassword) return;
    const done = flashCopied;

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(currentPassword).then(done, () => {
        legacyCopy();
        done();
      });
    } else {
      legacyCopy();
      done();
    }
  }

  /* ---------------- 事件绑定 ---------------- */
  lengthSlider.addEventListener('input', () => {
    lengthValue.textContent = lengthSlider.value;
    saveSettings();          // 记忆
    generatePassword();
  });

  document.querySelectorAll('.checkbox-label input').forEach((input) => {
    input.addEventListener('change', () => {
      saveSettings();        // 记忆
      generatePassword();
    });
  });

  generateBtn.addEventListener('click', generatePassword);

  copyBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    copyPassword();
  });

  outputBox.addEventListener('click', copyPassword);
  outputBox.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      copyPassword();
    }
  });

  /* ---------------- 初始化（先还原记忆，再渲染） ---------------- */
  loadSettings();
  lengthValue.textContent = lengthSlider.value;
  generatePassword();
})();

/* ============ 主题切换：与站内其他页面共用 cipher_theme_v2 ============ */
var THEME_KEY = 'cipher_theme_v2';
function applyTheme(theme, persist) {
    var normalized = theme === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', normalized);
    var isDark = normalized === 'dark';
    var btn = document.getElementById('themeToggle');
    if (btn) {
        btn.textContent = isDark ? '☀ 浅色模式' : '🌙 深色模式';
        btn.setAttribute('aria-pressed', String(isDark));
        btn.setAttribute('aria-label', isDark ? '切换到浅色模式' : '切换到深色模式');
    }
    /* 用户未显式选择过时，只跟随系统的深浅偏好显示，不写入存储，避免影响站内其他页面。 */
    if (persist !== false) {
        try { localStorage.setItem(THEME_KEY, normalized); } catch (e) { /* 存储不可用时仅本次生效 */ }
    }
}
applyTheme(document.documentElement.getAttribute('data-theme') || 'light', false);
document.getElementById('themeToggle').addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme') || 'light';
    applyTheme(cur === 'dark' ? 'light' : 'dark');
});
</script>
