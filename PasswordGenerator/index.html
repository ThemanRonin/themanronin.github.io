<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PasswordGenerator</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg: #eceef1;
    --card: #ffffff;
    --soft: #f4f5f7;
    --soft-hover: #edeff3;
    --line: #e6e8ec;
    --line-strong: #cdd2d9;
    --text: #15171b;
    --muted: #8b909a;
    --accent: #15171b;
  }

  body {
    margin: 0;
    padding: 32px 20px;
    min-height: 100vh;
    display: flex;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    width: 100%;
    max-width: 700px;
    margin: auto;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 26px;
    padding: 36px 44px 34px;
  }

  /* ---------- 头部 ---------- */
  .header { margin-bottom: 22px; }
  .header h1 {
    margin: 0;
    font-size: 19px;
    font-weight: 650;
    letter-spacing: .3px;
  }

  /* ---------- 密码输出区（固定高度） ---------- */
  .output {
    display: flex;
    align-items: center;
    gap: 14px;
    height: 132px;
    padding: 22px 16px 22px 26px;
    background: var(--soft);
    border-radius: 18px;
    cursor: pointer;
    transition: background-color .18s ease;
  }
  .output:hover { background: var(--soft-hover); }
  .output:focus-visible { outline: 2px solid #8ab4f8; outline-offset: 2px; }

  .password {
    flex: 1;
    min-width: 0;
    max-height: 100%;
    overflow-y: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    font-family: 'Courier Prime', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 24px;
    line-height: 1.45;
    letter-spacing: .5px;
    word-break: break-all;
    overflow-wrap: anywhere;
  }
  .password::-webkit-scrollbar { display: none; }

  .password.error {
    font-family: inherit;
    font-size: 13.5px;
    line-height: 1.6;
    letter-spacing: 0;
    color: #e5484d;
  }

  .ch-upper  { color: #16a34a; }
  .ch-lower  { color: #15171b; }
  .ch-digit  { color: #2563eb; }
  .ch-symbol { color: #e8590c; }

  .copy-btn {
    flex: none;
    border: none;
    background: transparent;
    padding: 8px 12px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 12.5px;
    color: var(--muted);
    cursor: pointer;
    transition: color .15s ease, background-color .15s ease;
  }
  .copy-btn:hover { color: var(--text); background: rgba(0, 0, 0, .05); }
  .copy-btn.copied { color: #16a34a; }

  /* ---------- 统计信息 ---------- */
  .meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 22px;
    padding: 14px 6px 0;
    font-size: 12.5px;
    color: var(--muted);
    white-space: nowrap;
  }
  .meta b {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-weight: 700;
    font-size: 13.5px;
    color: var(--text);
  }

  /* 熵值颜色分级 */
  #entropyValue { transition: color .25s ease; }
  #entropyValue.weak   { color: #e5484d; }
  #entropyValue.fair   { color: #ea580c; }
  #entropyValue.good   { color: #ca8a04; }
  #entropyValue.strong { color: #16a34a; }
  #entropyValue.ultra  { color: #0e7490; }

  /* ---------- 区块 ---------- */
  .section { margin-top: 28px; }
  .section-title {
    margin: 0 0 12px;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: .5px;
    color: var(--muted);
  }

  /* ---------- 长度滑块 ---------- */
  .length-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .length-row .label { font-size: 13.5px; color: var(--muted); }
  .length-value {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 18px;
    font-weight: 650;
    min-width: 3ch;
    text-align: right;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    display: block;
    width: 100%;
    height: 7px;
    border-radius: 999px;
    outline: none;
    cursor: pointer;
    background: linear-gradient(to right,
                var(--accent) var(--fill, 26%),
                var(--line) var(--fill, 26%));
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #fff;
    border: 2.5px solid var(--accent);
    box-shadow: 0 1px 4px rgba(0, 0, 0, .12);
    transition: transform .15s ease;
  }
  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.12); }
  input[type="range"]::-moz-range-thumb {
    width: 17px;
    height: 17px;
    border-radius: 50%;
    background: #fff;
    border: 2.5px solid var(--accent);
    box-shadow: 0 1px 4px rgba(0, 0, 0, .12);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-track {
    height: 7px;
    border-radius: 999px;
    background: var(--line);
  }
  input[type="range"]::-moz-range-progress {
    height: 7px;
    border-radius: 999px;
    background: var(--accent);
  }

  /* ---------- 标签式复选框 ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    position: relative;
    display: inline-flex;
    align-items: center;
    padding: 10px 18px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #fff;
    font-size: 13.5px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    transition: background-color .15s ease, color .15s ease, border-color .15s ease;
  }
  .chip:hover { border-color: var(--line-strong); color: var(--text); }
  .chip input {
    position: absolute;
    width: 0; height: 0;
    opacity: 0;
    pointer-events: none;
  }
  .chip.is-on {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .chip:has(input:focus-visible) {
    outline: 2px solid #8ab4f8;
    outline-offset: 2px;
  }

  /* ---------- 主按钮 ---------- */
  .btn-primary {
    width: 100%;
    margin-top: 30px;
    padding: 17px 20px;
    border: none;
    border-radius: 16px;
    background: var(--accent);
    color: #fff;
    font-family: inherit;
    font-size: 15.5px;
    font-weight: 550;
    letter-spacing: .5px;
    cursor: pointer;
    transition: opacity .15s ease, transform .08s ease;
  }
  .btn-primary:hover { opacity: .86; }
  .btn-primary:active { transform: scale(.99); }

  /* ---------- 窄屏适配 ---------- */
  @media (max-width: 560px) {
    body { padding: 16px 12px; }
    .app { padding: 26px 20px 24px; border-radius: 20px; }
    .header { margin-bottom: 18px; }
    .output { height: 128px; padding: 18px 12px 18px 18px; gap: 10px; }
    .password { font-size: 17px; }
    .copy-btn { padding: 6px 8px; font-size: 12px; }
    .section { margin-top: 24px; }
    .chip { padding: 9px 14px; font-size: 13px; }
    .btn-primary { padding: 15px 18px; margin-top: 26px; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <h1>密码生成器</h1>
  </header>

  <!-- 密码显示 -->
  <div class="output" id="outputBox" tabindex="0" role="button" aria-label="点击复制密码">
    <div class="password" id="coloredPassword"></div>
    <button class="copy-btn" id="copyBtn" type="button">复制</button>
  </div>

  <!-- 统计信息 -->
  <div class="meta">
    <span>熵值 <b id="entropyValue">0</b> bits</span>
    <span>组合总数 <b id="totalCombinations">0</b></span>
  </div>

  <!-- 长度 -->
  <section class="section">
    <div class="length-row">
      <span class="label">密码长度</span>
      <span class="length-value" id="passwordLength">20</span>
    </div>
    <input type="range" id="lengthSlider" min="6" max="60" value="20" aria-label="密码长度">
  </section>

  <!-- 字符类型 -->
  <section class="section">
    <h2 class="section-title">字符类型</h2>
    <div class="chips">
      <label class="chip"><input type="checkbox" id="includeUppercase" checked><span>大写字母</span></label>
      <label class="chip"><input type="checkbox" id="includeLowercase" checked><span>小写字母</span></label>
      <label class="chip"><input type="checkbox" id="includeNumbers" checked><span>数字</span></label>
      <label class="chip"><input type="checkbox" id="includeSymbols" checked><span>常用符号</span></label>
      <label class="chip"><input type="checkbox" id="includeLatin1" checked><span>Latin-1 补充</span></label>
    </div>
  </section>

  <!-- 高级设置 -->
  <section class="section">
    <h2 class="section-title">高级设置</h2>
    <div class="chips">
      <label class="chip"><input type="checkbox" id="noRepeat" checked><span>字符不重复</span></label>
      <label class="chip"><input type="checkbox" id="excludeSimilar" checked><span>排除相似字符</span></label>
      <label class="chip"><input type="checkbox" id="noConsecutive" checked><span>避免连续字符</span></label>
    </div>
  </section>

  <button class="btn-primary" id="generateBtn" type="button">重新生成密码</button>
</div>

<script>
(function () {
  'use strict';

  const $ = (id) => document.getElementById(id);

  /* ---------------- 字符集 ---------------- */
  const CHARSETS = {
    upper:   'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    lower:   'abcdefghijklmnopqrstuvwxyz',
    digits:  '0123456789',
    symbols: '!@#$%^&*()_+[]{}|;:,.<>?',
    latin1:  '¡¢£¤¥¦§¨©ª«¬®¯°±²³´µ¶·¸¹º»¼½¾¿ÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏÐÑÒÓÔÕÖ×ØÙÚÛÜÝÞßàáâãäåæçèéêëìíîïðñòóôõö÷øùúûüýþÿ'
  };

  const SIMILAR = '1iIlL0Oo';

  const TYPE_OPTIONS = [
    { id: 'includeUppercase', key: 'upper'   },
    { id: 'includeLowercase', key: 'lower'   },
    { id: 'includeNumbers',   key: 'digits'  },
    { id: 'includeSymbols',   key: 'symbols' },
    { id: 'includeLatin1',    key: 'latin1'  }
  ];

  const BOOL_IDS = ['noRepeat', 'excludeSimilar', 'noConsecutive'];

  /* 熵值颜色分级 */
  const LEVELS = [
    { max: 50,       key: 'weak'   },
    { max: 80,       key: 'fair'   },
    { max: 120,      key: 'good'   },
    { max: 160,      key: 'strong' },
    { max: Infinity, key: 'ultra'  }
  ];

  /* ---------------- DOM ---------------- */
  const lengthSlider        = $('lengthSlider');
  const lengthValue         = $('passwordLength');
  const passwordEl          = $('coloredPassword');
  const outputBox           = $('outputBox');
  const entropyValue        = $('entropyValue');
  const totalCombinationsEl = $('totalCombinations');
  const copyBtn             = $('copyBtn');
  const generateBtn         = $('generateBtn');

  let currentPassword = '';
  let copyTimer = null;

  /* ============================================================
     浏览器记忆（localStorage）
     ============================================================ */
  const STORAGE_KEY = 'password-generator-settings-v1';

  function isStorageAvailable() {
    try {
      const k = '__pwd_gen_test__';
      localStorage.setItem(k, '1');
      localStorage.removeItem(k);
      return true;
    } catch (e) {
      return false;
    }
  }
  const storageOK = isStorageAvailable();

  function saveSettings() {
    if (!storageOK) return;
    try {
      const data = { length: Number(lengthSlider.value) };
      TYPE_OPTIONS.forEach(({ id }) => { data[id] = $(id).checked; });
      BOOL_IDS.forEach((id) => { data[id] = $(id).checked; });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) { /* 忽略写入异常 */ }
  }

  function loadSettings() {
    if (!storageOK) return;
    let data;
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      data = JSON.parse(raw);
      if (!data || typeof data !== 'object') return;
    } catch (e) { return; }

    // 长度
    if (typeof data.length === 'number' && isFinite(data.length)) {
      const min = Number(lengthSlider.min);
      const max = Number(lengthSlider.max);
      lengthSlider.value = String(Math.min(max, Math.max(min, Math.round(data.length))));
    }

    // 所有复选框（只接受布尔值）
    [...TYPE_OPTIONS.map((o) => o.id), ...BOOL_IDS].forEach((id) => {
      if (typeof data[id] === 'boolean') {
        $(id).checked = data[id];
      }
    });
  }

  /* ---------------- 无模偏差随机数 ---------------- */
  function randomInt(max) {
    if (max <= 1) return 0;
    const RANGE = 4294967296;                       // 2^32
    const limit = Math.floor(RANGE / max) * max;
    const buf = new Uint32Array(1);
    let value;
    do {
      crypto.getRandomValues(buf);
      value = buf[0];
    } while (value >= limit);
    return value % max;
  }

  /* ---------------- 构建字符池 ---------------- */
  function buildPool() {
    let pool = '';
    TYPE_OPTIONS.forEach(({ id, key }) => {
      if ($(id).checked) pool += CHARSETS[key];
    });

    if ($('excludeSimilar').checked) {
      pool = Array.from(pool).filter((c) => !SIMILAR.includes(c)).join('');
    }
    return Array.from(new Set(pool)).join('');
  }

  /* ---------------- 字符着色 ---------------- */
  function charClass(ch) {
    if (CHARSETS.upper.includes(ch))  return 'ch-upper';
    if (CHARSETS.digits.includes(ch)) return 'ch-digit';
    if (CHARSETS.lower.includes(ch))  return 'ch-lower';
    return 'ch-symbol';
  }

  function renderPassword(chars) {
    passwordEl.classList.remove('error');
    passwordEl.textContent = '';
    const frag = document.createDocumentFragment();
    chars.forEach((ch) => {
      const span = document.createElement('span');
      span.className = charClass(ch);
      span.textContent = ch;
      frag.appendChild(span);
    });
    passwordEl.appendChild(frag);
  }

  /* ---------------- 错误提示 ---------------- */
  function showError(message) {
    currentPassword = '';
    passwordEl.textContent = message;
    passwordEl.classList.add('error');

    entropyValue.textContent = '0';
    entropyValue.className = '';
    totalCombinationsEl.textContent = '—';
  }

  /* ---------------- 统计与颜色分级 ---------------- */
  function updateStats(poolSize, length) {
    const entropy = length * Math.log2(poolSize);

    entropyValue.textContent = entropy.toFixed(1);

    const level = LEVELS.find((l) => entropy < l.max) || LEVELS[LEVELS.length - 1];
    entropyValue.className = level.key;

    const total = Math.pow(poolSize, length);
    totalCombinationsEl.textContent =
      Number.isFinite(total) ? total.toExponential(2) : '∞';
  }

  /* ---------------- 生成密码 ---------------- */
  function generatePassword() {
    const length           = Number(lengthSlider.value);
    const pool             = buildPool();
    const useNoRepeat      = $('noRepeat').checked;
    const useNoConsecutive = $('noConsecutive').checked;

    if (pool.length === 0) {
      showError('请至少选择一种字符类型');
      return;
    }
    if (useNoRepeat && pool.length < length) {
      showError(`可用字符不足：当前字符池仅 ${pool.length} 个字符，无法生成 ${length} 位不重复密码`);
      return;
    }
    if (useNoConsecutive && pool.length < 2) {
      showError('可用字符过少，无法避免连续重复字符');
      return;
    }

    const chars = [];
    const used = new Set();
    let last = null;
    let guard = 0;
    const guardLimit = length * 500 + 5000;

    while (chars.length < length && guard++ < guardLimit) {
      const ch = pool[randomInt(pool.length)];
      if (useNoRepeat && used.has(ch)) continue;
      if (useNoConsecutive && ch === last) continue;

      chars.push(ch);
      used.add(ch);
      last = ch;
    }

    while (chars.length < length) {          // 兜底（理论上不会触发）
      chars.push(pool[randomInt(pool.length)]);
    }

    currentPassword = chars.join('');
    renderPassword(chars);
    updateStats(pool.length, length);
  }

  /* ---------------- 复制 ---------------- */
  function legacyCopy() {
    const ta = document.createElement('textarea');
    ta.value = currentPassword;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) { /* 忽略 */ }
    document.body.removeChild(ta);
  }

  function flashCopied() {
    copyBtn.textContent = '已复制';
    copyBtn.classList.add('copied');
    clearTimeout(copyTimer);
    copyTimer = setTimeout(() => {
      copyBtn.textContent = '复制';
      copyBtn.classList.remove('copied');
    }, 1600);
  }

  function copyPassword() {
    if (!currentPassword) return;
    const done = flashCopied;

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(currentPassword).then(done, () => {
        legacyCopy();
        done();
      });
    } else {
      legacyCopy();
      done();
    }
  }

  /* ---------------- 滑块进度填充 ---------------- */
  function updateSliderFill() {
    const min = Number(lengthSlider.min);
    const max = Number(lengthSlider.max);
    const val = Number(lengthSlider.value);
    const percent = ((val - min) / (max - min)) * 100;
    lengthSlider.style.setProperty('--fill', percent + '%');
  }

  /* ---------------- 标签状态同步 ---------------- */
  function syncChips() {
    document.querySelectorAll('.chip input').forEach((input) => {
      input.closest('.chip').classList.toggle('is-on', input.checked);
    });
  }

  /* ---------------- 事件绑定 ---------------- */
  lengthSlider.addEventListener('input', () => {
    lengthValue.textContent = lengthSlider.value;
    updateSliderFill();
    saveSettings();          // 记忆
    generatePassword();
  });

  document.querySelectorAll('.chip input').forEach((input) => {
    input.addEventListener('change', () => {
      syncChips();
      saveSettings();        // 记忆
      generatePassword();
    });
  });

  generateBtn.addEventListener('click', generatePassword);

  copyBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    copyPassword();
  });

  outputBox.addEventListener('click', copyPassword);
  outputBox.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      copyPassword();
    }
  });

  /* ---------------- 初始化（先还原记忆，再渲染） ---------------- */
  loadSettings();
  syncChips();
  lengthValue.textContent = lengthSlider.value;
  updateSliderFill();
  generatePassword();
})();
</script>
</body>
</html>
